<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Before and after batch print flow comparison</title>
<desc>Two flow diagrams comparing the manual tag printing process, done one product at a time, against the new batch print flow that handles multiple products at once, reducing time per product from about 28 seconds to about 12 seconds, a 52 percent decrease.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Section: Before -->
<rect x="40" y="30" width="600" height="210" rx="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="60" y="55" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Before — one product at a time</text>

<g>
<rect x="60" y="80" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="140" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Select product</text>
<text x="140" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">one at a time</text>
</g>

<g>
<rect x="240" y="80" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Configure tag details</text>
<text x="340" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">shelf life &amp; notes</text>
</g>

<g>
<rect x="460" y="80" width="160" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="540" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Print tag</text>
<text x="540" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">printed alone</text>
</g>

<line x1="220" y1="108" x2="240" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440" y1="108" x2="460" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="136" x2="340" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="255" y="160" width="170" height="34" rx="17" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="340" y="181" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">~28s per product</text>
</g>

<!-- Section: After -->
<rect x="40" y="270" width="600" height="210" rx="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="60" y="295" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">After — multiple products at once</text>

<g>
<rect x="60" y="320" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="140" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Select products</text>
<text x="140" y="358" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">one or many</text>
</g>

<g>
<rect x="240" y="320" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Configure tag details</text>
<text x="340" y="358" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">shelf life &amp; notes</text>
</g>

<g>
<rect x="460" y="320" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="540" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">Batch print</text>
<text x="540" y="358" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">multiple products</text>
</g>

<line x1="220" y1="348" x2="240" y2="348" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440" y1="348" x2="460" y2="348" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="376" x2="340" y2="400" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="230" y="400" width="220" height="34" rx="17" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="421" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">~12s per product (-52%)</text>
</g>

</svg>
